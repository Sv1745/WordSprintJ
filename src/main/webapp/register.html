<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordSprint - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>WordSprint</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>User Registration</h2>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <form id="register-form" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                    <small style="color: var(--text-muted); font-size: 0.8rem;">Min 5 letters (must contain both uppercase & lowercase)</small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <small style="color: var(--text-muted); font-size: 0.8rem;">Min 5 characters (letters, numbers, & special char: $, %, *, @, #, !, &)</small>
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div class="button-group">
                <p style="color: var(--text-muted); font-size: 0.95rem;">Already have an account? <a href="login.html" style="color: var(--accent-blue);">Login here</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 WordSprint. Java Web Application.</p>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
