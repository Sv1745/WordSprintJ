<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordSprint - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>WordSprint</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Create Account</h2>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <form id="register-form" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="e.g. TestUser">
                    <small style="color: #666; font-size: 0.8rem;">At least 5 characters (must include uppercase and lowercase letters)</small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="e.g. Pass123*">
                    <small style="color: #666; font-size: 0.8rem;">At least 5 characters (letters, numbers, & special char: $, %, *, @, #, !, &)</small>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="player" selected>Player</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div class="button-group">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>WordSprint. Java Web Application.</p>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
